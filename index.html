<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>inspire-associate | Web Development & Digital Solutions</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="inspire-associate provides modern web development, mobile app development, UI/UX design and digital solutions in Sri Lanka."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="web development sri lanka, mobile app development, software company, ui ux design"
    />

    <!-- Author -->
    <meta name="author" content="inspire-associate" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://inspire-associate.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="inspire-associate" />
    <meta
      property="og:description"
      content="Modern web and mobile solutions for businesses."
    />
    <meta property="og:image" content="https://inspire-associate.com/preview.jpg" />
    <meta property="og:url" content="https://inspire-associate.com/" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="inspire-associate" />
    <meta
      name="twitter:description"
      content="Modern web and mobile solutions for businesses."
    />
    <meta
      name="twitter:image"
      content="https://inspire-associate.com/preview.jpg"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  </head>

    <div id="root"></div>
